name: Pull Request

on:
  push:
    branches:
    - main
  pull_request:
      types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    - name: Run Unit Tests
      run: uv run pytest

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v7
      with:
        name: coverage.xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7
        archive: false

    - name: Upload Allure Results
      uses: actions/upload-artifact@v7
      with:
        name: allure-results.zip
        path: allure-results/
        if-no-files-found: error
        retention-days: 7

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk-oss:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v7

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Setup Snyk
      uses: snyk/actions/setup@v1

    - name: Snyk Test
      continue-on-error: true
      run: snyk test --sarif-file-output=snyk.sarif
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Upload Snyk report to GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif

    - name: Snyk Monitor
      if: github.ref == 'refs/heads/main'
      run: |
        snyk monitor \
          --project-name="weather_api"
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    - name: Setup Snyk
      uses: snyk/actions/setup@v1

    - name: Snyk Test
      continue-on-error: true
      run: |
        snyk code test \
          --report \
          --project-name="weather_api" \
          --sarif-file-output=snyk.sarif
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: Upload Snyk report to GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml

    - name: Upload coverage report to Coveralls
      uses: coverallsapp/github-action@v2

  allure:
    name: Allure
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      pull-requests: write
      checks: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download Allure Results
      uses: actions/download-artifact@v8
      with:
        name: allure-results.zip
        path: allure-results/

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Build Allure Report
      run: npx -y allure generate

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: allure-report/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: Upload Allure Report History
      uses: actions/upload-artifact@v7
      with:
        name: allure-results.zip
        path: history.jsonl
        if-no-files-found: error
        retention-days: 7

    - name: Publish Allure Report to Pull Request
      uses: allure-framework/allure-action@v0
      if: github.event_name == 'pull_request'
      with:
        remote-href: ${{ steps.deployment.outputs.page_url }}
