name: Pull Request

on:
  push:
    branches:
    - main
  pull_request:
      types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Run Unit Tests
      run: uv run pytest
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v7
      with:
        name: coverage.xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7
        archive: false

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: Upload coverage report to Coveralls
      uses: coverallsapp/github-action@v2
