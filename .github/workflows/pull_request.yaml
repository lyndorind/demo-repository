name: Pull Request

on:
  push:
    branches:
    - main
  pull_request:
      types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Run Unit Tests
      run: uv run pytest
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v7
      with:
        name: coverage.xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7
        archive: false

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk-oss:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v7
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Setup Snyk
      uses: snyk/actions/setup@v1
    - name: Snyk Test
      continue-on-error: true
      run: snyk test --sarif-file-output=snyk.sarif
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    - name: Upload Snyk report to GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif
    - name: Snyk Monitor
      run: snyk monitor
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Setup Snyk
      uses: snyk/actions/setup@v1
    - name: Snyk Test
      continue-on-error: true
      run: snyk code test --sarif-file-output=snyk.sarif
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    - name: Upload Snyk report to GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk.sarif

  codecov:
    name: Codecov
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}

  coveralls:
    name: Coveralls
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Download Coverage Report
      uses: actions/download-artifact@v8
      with:
        name: coverage.xml
    - name: Upload coverage report to Coveralls
      uses: coverallsapp/github-action@v2
